namespace=WWMIv1


; Key Bindings -------------------------

[KeyToggleMods]
Key = no_modifiers F6
run = CommandListToggleMods


[KeyToggleCompatibilityMode]
key = ALT F12
run = CommandListToggleCompatibilityMode


[KeyToggleUserGuide]
key = no_modifiers F12
run = CommandListToggleUserGuide


[KeyToggleHuntingModeGuide]
key = CTRL F12
run = CommandListHuntingModeGuide


[KeyHideNotification]
key = X
key = XB_X
run = CommandListHideNotification
condition = $show_notification_widget == 1


[KeyHideFirstRunNotification]
Key = no_modifiers F10
type = cycle
$first_run = 0,1
condition = $first_run == 1
