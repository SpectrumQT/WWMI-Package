namespace=WWMIv1


; ------------------------------------------------------------------------------
; - SHAPE KEYS API
; ------------------------------------------------------------------------------

; Sets value of custom Shape Key or override value of original one
[CommandListSetShapeKey]
; Usage example (set value override for Shape Key 86 to 0.5):
; $shapekeys_update_required = 1
; $\WWMIv1\shapekey_id = 86
; $\WWMIv1\shapekey_value = 0.5
; cs-u5 = ResourceCustomShapeKeyValuesRW
; run = CommandList\WWMIv1\SetShapeKey
;
; Input:
; $\WWMIv1\shapekey_id (int, range [0, 127])
; $\WWMIv1\shapekey_value (float, range [0.0, 1.0])
; cs-u5 = ResourceCustomShapeKeyValuesRW
$shapekey_mode = 0
run = CustomShaderShapeKeySetter


; Disables value override of original Shape Key
[CommandListDisableShapeKeyOverride]
; Usage example (disable value override for Shape Key 21):
; $shapekeys_update_required = 1
; $\WWMIv1\shapekey_id = 21
; cs-u5 = ResourceCustomShapeKeyValuesRW
; run = CommandList\WWMIv1\DisableShapeKeyOverride
;
; Input:
; $\WWMIv1\shapekey_id (int, range [0, 127])
; cs-u5 = ResourceCustomShapeKeyValuesRW
$shapekey_mode = 1
run = CustomShaderShapeKeySetter


; ------------------------------------------------------------------------------
; - COMPONENT API - OVERRIDE TEXTURES
; ------------------------------------------------------------------------------

; Stores the original texture reference for each pixel-shader texture slot.
;
; The INI var associated with each entry ($PoolOriginalTextures) is also
; used to track the best Hamming distance found for that slot.
;
; A value of 65 means that no valid match has been recorded yet.
[PoolOriginalTextures]
pool_size = 128
pool_element_type_switch_reset = 0


; Stores the Hamming distance calculated for each slot during the current matching pass.
; A value of 65 indicates that no valid distance was calculated.
[PoolHammingDistances]
pool_size = 128


; Save the current texture reference and reset the slot's best-match distance.
[CommandListSnapshotOriginalTexture]
PoolOriginalTextures[$slot_id] = ref ps-t[$slot_id]
$PoolOriginalTextures[$slot_id] = 65

; Snapshot the original texture references for all texture slots used by the current pixel shader.
[CommandListSnapshotOriginalTextures]
CommandListCallback_OnTextureSlot = ref CommandListSnapshotOriginalTexture
run = CommandListIterateTextureSlots


; Restore the texture reference saved by the most recent snapshot.
; Also reset the slot's best-match distance so a subsequent override pass can
; find a new match without being affected by previous results.
[CommandListRestoreOriginalTexture]
ps-t[$slot_id] = ref PoolOriginalTextures[$slot_id]
$PoolOriginalTextures[$slot_id] = 65

; Restore the original textures in all texture slots used by the current pixel shader.
[CommandListRestoreOriginalTextures]
CommandListCallback_OnTextureSlot = ref CommandListRestoreOriginalTexture
run = CommandListIterateTextureSlots


[Constants]
; Maximum acceptable Hamming distance.
; A 64-bit hash has a possible distance of 0–64:
;   0  = identical hashes
;   16 = 75% bit agreement
;   64 = no matching bits
; The threshold is inclusive: a distance equal to this value is accepted.
global $hamming_threshold = 16

global $best_hamming_distance = 0

[ResourceTexture]

; Overrides best matching texture with ResourceTexture across all ps-t slots declared by the current pixel shader.
;
; Matching is based on Hamming distance between dhash of texture in ps-t slot and `original_dhash` of ResourceTexture.
; Hamming distance can be read as "visual similarity", where Hamming distance of 0 is 100% similarity, and 64 is 0%.
; Default matching threshold is Hamming distance of 16 (75% similarity), and can be adjusted via $hamming_distance.
[CommandListOverrideBestMatchingTexture]
; Calculate Hamming distances between `original_dhash` of ResourceTexture and texture in each ps-t slot.
; The smallest Hamming distance will be stored in $best_hamming_distance.
$best_hamming_distance = 65
CommandListCallback_OnTextureSlot = ref CommandListCalculateHammingDistance
run = CommandListIterateTextureSlots
; Replace textures in ps-t slots with ResourceTexture when their Hamming distance is equal to $best_hamming_distance.  
if $best_hamming_distance <= $hamming_threshold
    CommandListCallback_OnTextureSlot = ref CommandListOverrideMatchingTexture
    run = CommandListIterateTextureSlots
endif
$hamming_threshold = 16


[CommandListOverrideTextureSlots]
run = CommandListOverrideBestMatchingTexture


; ------------------------------------------------------------------------------
; - CommandListOverrideBestMatchingTexture Implementation
; ------------------------------------------------------------------------------

; Calculate the Hamming distance between the original texture in the current slot and ResourceTexture.
;
; Only textures with a matching format are compared.
; A negative distance indicates that the comparison failed or produced an invalid result.
;
; The calculated distance is saved per slot.
; The smallest valid distance across all slots is stored in $best_hamming_distance.
[CommandListCalculateHammingDistance]
local $hamming_distance = 65
if ps-t[$slot_id]->Format == ResourceTexture->OriginalFormat
    ; Compare the original texture in this slot with the candidate resource.
    $hamming_distance = PoolOriginalTextures[$slot_id]->HammingDistance(ResourceTexture)
    ; Treat an invalid comparison as an unavailable match.
    if $hamming_distance < 0
        $hamming_distance = 65
    ; Keep track of the best distance across all slots.
    elif $hamming_distance < $best_hamming_distance
        $best_hamming_distance = $hamming_distance
    endif
endif
; Store this slot's result for the second pass.
$PoolHammingDistances[$slot_id] = $hamming_distance

; Replace the texture in the current slot if:
;   1. Its distance equals the best distance found across all slots.
;   2. Its distance improves on the best distance previously recorded for this slot.
[CommandListOverrideMatchingTexture]
local $hamming_distance = $PoolHammingDistances[$slot_id]
if $hamming_distance == $best_hamming_distance
    ; Prevents less accurate match from replacing a better match already assigned to this slot.
    if $hamming_distance < $PoolOriginalTextures[$slot_id]
        $PoolOriginalTextures[$slot_id] = $hamming_distance
        ps-t[$slot_id] = ref ResourceTexture
    endif
endif


; ------------------------------------------------------------------------------
; - TEXT PRINTER API
; ------------------------------------------------------------------------------

; Prints text on screen using provided params
[CommandListPrintText]
; Input:
; Resource\WWMIv1\Text
; Resource\WWMIv1\TextParams
;
; Usage example (resource formats are listed below):
; Resource\WWMIv1\Text = ref ResourceMyText
; Resource\WWMIv1\TextParams = ref ResourceMyTextParams
; run = CommandList\WWMIv1\PrintText
run = CommandListRenderText


; Text string example resource printable by CommandListPrintText
[ResourceTextExample]
type = Buffer
data = "Hello World!"


; Text file example resource printable by CommandListPrintText
[ResourceTextFileExample]
type = buffer
format = R8_UINT
filename = MyText.txt


; Text params example resource for CommandListPrintText
; Using these parameter buffers as a way to pass in constant parameters without
; taking up any of the IniParams slots while still allowing the parameters to
; be customised on a per-message basis.
[ResourceTextParamsExample]
type = StructuredBuffer
array = 1
data = R32_FLOAT  -0.25 +0.15 +0.25 -0.05   1.00 1.00 1.00 1.00   0.00 0.00 0.00 0.95   0.02  0.05   2 1   1   1.0
;                x1-^  y1-^  x2-^  y2-^   | R-^  G-^  B-^  A-^  | R-^  G-^  B-^  A-^  | ^-H    V-^ | ^ ^ | ^- text alignment: 0=left 1=center 2=right | ^- font scale
;                Rectangle (range -1:+1)  | Text Color          | Background Color    | Border     |  ^- h/v-anchor: 0=none 1=left/top 2=center 3=right/bottom 
