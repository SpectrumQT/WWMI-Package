namespace=WWMIv1


[Constants]
global persist $first_run = 1

global $show_wwmi_version = 1
global $show_option_toggle_widget = 0
global $show_notification_widget = 0

global $show_xxmi_error = 0
global $show_mod_error = 0
global $show_guide = 0

global $option_toggle_time = 0

global locked $enum_widget_mods_display = 1
global locked $enum_widget_compatibility_mode = 2

global locked $enum_guide_user = 1
global locked $enum_guide_hunting_mode = 2


; ------------------------------------------------------------------------------
; - HOTKEY HANDLERS
; ------------------------------------------------------------------------------

[CommandListToggleUserGuide]
if $show_guide != $enum_guide_user
    $show_guide = $enum_guide_user
    $show_notification_widget = 1
else
    $show_guide = 0
endif


[CommandListHuntingModeGuide]
if $show_guide != $enum_guide_hunting_mode
    $show_guide = $enum_guide_hunting_mode
    $show_notification_widget = 1
else
    $show_guide = 0
endif


[CommandListHideNotification]
if $show_xxmi_error
    $show_xxmi_error = 0

elif $show_mod_error
    $show_mod_error = 0

elif $show_guide
    $show_guide = 0
endif


; ------------------------------------------------------------------------------
; - DRAW GUI
; ------------------------------------------------------------------------------

[CommandListRenderGUI]
; WWMI version widget in bottom-left corner
if $show_wwmi_version
    ResourceText = ref ResourceVersionNotification
    ResourceTextParams = ref ResourceVersionNotificationParams
    run = CommandListPrintText
    if $first_run
        $show_guide = $enum_guide_user
        $show_notification_widget = 1
    endif
    if time > 30
        $show_wwmi_version = 0
    endif
endif

; WWMI option toggle widget in top-middle
if $show_option_toggle_widget
    ; "Mods Display" hotkey
    if $show_option_toggle_widget == $enum_widget_mods_display
        if $enable_mods
            ResourceText = ref ResourceModsDisplayEnabled
        else
            ResourceText = ref ResourceModsDisplayDisabled
        endif
    ; "Compatibility Mode" hotkey
    elif $show_option_toggle_widget == $enum_widget_compatibility_mode
        if $enable_compatibility_mode
            ResourceText = ref ResourceCompatibilityModeEnabled
        else
            ResourceText = ref ResourceCompatibilityModeDisabled
        endif
    endif
    ; Render text widget
    ResourceTextParams = ResourceOptionToggleWidgetParams
    run = CommandListPrintText
    ; Hide widget after 1.5s
    if time - $option_toggle_time > 1.5
        $option_toggle_time = 0
        $show_option_toggle_widget = 0
    endif
endif

; Main notification widget in the middle
if $show_notification_widget
    if $show_xxmi_error
        ResourceText = ref ResourceErrorOldVersionXXMI
        ResourceTextParams = ref ResourceNotificationWidgetParams
        run = CommandListPrintText

    elif $show_mod_error
        ResourceText = ref ResourceErrorIncompatibleVersionRef
        ResourceTextParams = ref ResourceUserNotificationParams
        run = CommandListPrintText

        ResourceText = ref ResourceErrorIncompatibleVersionModNameRef
        ResourceTextParams = ref ResourceErrorIncompatibleVersionModNameParams
        run = CommandListPrintText

    elif $show_guide
        if $show_guide == $enum_guide_user
            ResourceText = ref ResourceUserGuide
        elif $show_guide == $enum_guide_hunting_mode
            ResourceText = ref ResourceHuntingModeGuide
        endif

        ResourceTextParams = ref ResourceNotificationWidgetParams
        run = CommandListPrintText
    else
        $show_notification_widget = 0
    endif
endif


; ------------------------------------------------------------------------------
; - RESOURCES
; ------------------------------------------------------------------------------

[ResourceModsDisplayEnabled]
type = Buffer
data = "Mods Display: Enabled"


[ResourceModsDisplayDisabled]
type = Buffer
data = "Mods Display: Disabled"


[ResourceCompatibilityModeEnabled]
type = Buffer
data = "Compatibility Mode: Enabled"


[ResourceCompatibilityModeDisabled]
type = Buffer
data = "Compatibility Mode: Disabled"


[ResourceUserGuide]
type = buffer
format = R8_UINT
filename = Notifications/UserGuide.md


[ResourceHuntingModeGuide]
type = buffer
format = R8_UINT
filename = Notifications/HuntingModeGuide.md


[ResourceErrorOldVersionMod]
type = buffer
format = R8_UINT
filename = Notifications/ErrorOldVersionMod.md


[ResourceErrorCompatibilityModeDisabled]
type = buffer
format = R8_UINT
filename = Notifications/ErrorCompatibilityModeDisabled.md


[ResourceErrorOldVersionWWMI]
type = buffer
format = R8_UINT
filename = Notifications/ErrorOldVersionWWMI.md


[ResourceErrorOldVersionXXMI]
type = buffer
format = R8_UINT
filename = Notifications/ErrorOldVersionXXMI.md


[ResourceErrorIncompatibleVersionRef]
[ResourceErrorIncompatibleVersionModNameRef]


[ResourceUnnamedModName]
type = Buffer
data = "< Unnamed Mod >"


